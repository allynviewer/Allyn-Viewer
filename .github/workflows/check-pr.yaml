name: Check PR

# Fails fast when a pull request has no usable description. The description
# must say what changed and how it was tested (see .github/pull_request_template.md).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '')
              .replace(/<!--[\s\S]*?-->/g, '') // ignore template comments
              .trim();
            if (body.length < 40) {
              core.setFailed('PR description is too short. Explain what changed and how you tested it (build.bat commands, Windows version, GPU).');
            }
